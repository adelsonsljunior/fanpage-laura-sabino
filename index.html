<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanpage Laura Sabino</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="topo">
        <img src="./images/perfil.jpg" alt="" id="perfil">
        <div>
            <h1>Laura Sabino</h1>
            <h2>Tirar o jovem do seio do liberalismo e colocar na teta de Marx ☭</h2>
        </div>
    </div>

    <div id="lista"></div>

    <div class="contact-form">
        <h2>Entre em Contato</h2>
        <form id="contactForm" action="#!">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email" placeholder="Seu e-mail">

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui"></textarea>

            <button type="submit" id="openButton"> Enviar</button>
        </form>

    </div>

    <dialog id="myDialog">
        <p id="mensagemStatus"></p>
        <button id="closeButton">Fechar</button>
    </dialog>

    <script src="./js/script.js"></script>
</body>

</html>
